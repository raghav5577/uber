services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      retries: 10

  gateway:
    build: ./gateway
    expose:
      - "3000"
    environment: 
      PORT: 3000
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      RIDE_SERVICE_URL: http://ride-service:3001
      LOCATION_SERVICE_URL: http://location-service:3003
    depends_on:
      - ride-service
      - location-service

  ride-service:
    build: ./ride-service
    environment:
      PORT: 3001
      INTERNAL_KEY: ${INTERNAL_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL}
      MATCHING_SERVICE_URL: http://matching-service:3002
      LOCATION_SERVICE_URL: http://location-service:3003

  matching-service:
    build: ./matching-service
    environment:
      PORT: 3002
      INTERNAL_KEY: ${INTERNAL_KEY}
      REDIS_URL: redis://redis:6379
      RIDE_SERVICE_URL: http://ride-service:3001
      LOCATION_SERVICE_URL: http://location-service:3003
    depends_on:
      redis:
        condition: service_healthy

  location-service:
    build: ./location-service
    environment:
      PORT: 3003
      INTERNAL_KEY: ${INTERNAL_KEY}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy