events {
    worker_connections 1024;
}

http {
    # Upstream pool for API Gateway instances
    # Docker automatically round-robins across container replicas of the 'gateway' service
    upstream gateway_cluster {
        server gateway:3000;
        keepalive 32;
    }

    # Enable Gzip compression for API responses
    gzip on;
    gzip_types application/json text/plain;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Edge health check
        location /nginx-health {
            return 200 '{"service":"nginx","ok":true}\n';
            add_header Content-Type application/json;
        }

        # Reverse proxy all traffic to the API Gateway cluster
        location / {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;

            # Header preservation
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}