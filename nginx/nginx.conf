events {
    worker_connections 1024;
}

http {
    # Upstream pool for API Gateway instances
    upstream gateway_cluster {
        server gateway:3000;
        keepalive 32;
    }

    gzip on;
    gzip_types application/json text/plain;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Edge health check
        location /nginx-health {
            return 200 '{"service":"nginx","ok":true}\n';
            add_header Content-Type application/json;
        }

        # Real-Time WebSocket endpoint: ws://localhost/ws
        location /ws {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;

            # HTTP Upgrade headers for WebSocket protocol handshake
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for persistent real-time connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API reverse proxy
        location / {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}